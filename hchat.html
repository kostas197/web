<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kos chat</title>
    <!-- Cargar MQTT.js desde CDN -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0b141a; color: #e9edef; display: flex; flex-direction: column; height: 100vh; padding: 10px; gap: 10px; }
        
        #config-panel { background: #202c33; padding: 10px; border-radius: 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
        input, select, button { padding: 8px 12px; border-radius: 6px; border: none; font-size: 14px; outline: none; }
        input, select { background: #2a3942; color: #e9edef; flex: 1; min-width: 140px; }
        button { background: #00a884; color: white; font-weight: bold; cursor: pointer; }
        button:hover { background: #029374; }
        button#disconnect-btn { background: #d93838; }
        button#attach-btn { background: #53bdeb; color: #0b141a; }
        button#attach-btn:hover { background: #3fa5d3; }

        .config-row { display: flex; gap: 8px; width: 100%; flex-wrap: wrap; }

        #chat-container { flex: 1; overflow-y: auto; background: #111b21; border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 6px; border: 1px solid #202c33; }
        
        .message { padding: 6px 10px; border-radius: 6px; word-break: break-word; font-size: 13px; line-height: 1.4; background: #202c33; max-width: 80%; }
        .message.system { color: #8696a0; font-style: italic; align-self: center; }
        .message.incoming { align-self: flex-start; border-left: 3px solid #00a884; }
        .message.outgoing { align-self: flex-end; border-left: 3px solid #53bdeb; }
        .sender { font-weight: bold; color: #53bdeb; margin-bottom: 2px; font-size: 11px; }
        .time { font-size: 10px; color: #8696a0; text-align: right; margin-top: 2px; }
        .file-link { display: inline-block; margin-top: 4px; padding: 4px 8px; background: #00a884; color: white; border-radius: 4px; text-decoration: none; font-weight: bold; }
        .file-link:hover { background: #029374; }

        #input-container { display: flex; gap: 8px; }
    </style>
</head>
<body>

    <div id="config-panel">
        <div class="config-row">
            <select id="broker-select">
                <option value="wss://broker.hivemq.com:8884/mqtt">HiveMQ (Público WSS)</option>
                <option value="wss://broker.emqx.io:8084/mqtt">EMQX (Público WSS)</option>
                <option value="wss://test.mosquitto.org:8081/mqtt">Mosquitto Eclipse (Público WSS)</option>
                <option value="custom">-- Escribir URL personalizada --</option>
            </select>
            <input type="text" id="broker-url-custom" placeholder="wss://tu-servidor:puerto/mqtt" style="display:none;">
            <input type="text" id="topic-input" placeholder="Topic" value="kos/volatile/chat">
        </div>
        <div class="config-row">
            <input type="text" id="username-input" placeholder="Tu Nombre"> 
            <input type="password" id="password-input" placeholder="Contraseña compartida">
            <button id="connect-btn">Conectar</button>
            <button id="disconnect-btn" style="display:none;">Desconectar</button>
        </div>
    </div>

    <div id="chat-container">
        <div class="message system">Estado: Desconectado. Selecciona un broker y conéctate.</div>
    </div>

    <div id="input-container">
        <input type="text" id="message-input" placeholder="Escribe un mensaje..." disabled>
        <input type="file" id="file-input" style="display:none;" multiple>
        <button id="attach-btn" disabled>Adjuntar</button>
        <button id="send-btn" disabled>Enviar</button>
    </div>

    <script>
        let client = null;
        let cryptoKey = null;
        let peerConnection = null;
        let dataChannel = null;
        const mySessionId = 'session_' + Math.random().toString(36).substr(2, 9);

        const rtcConfig = {
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        };

        const brokerSelect = document.getElementById('broker-select');
        const brokerUrlCustom = document.getElementById('broker-url-custom');
        const topicInput = document.getElementById('topic-input');
        const usernameInput = document.getElementById('username-input');
        const passwordInput = document.getElementById('password-input');
        const connectBtn = document.getElementById('connect-btn');
        const disconnectBtn = document.getElementById('disconnect-btn');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const attachBtn = document.getElementById('attach-btn');
        const fileInput = document.getElementById('file-input');
        const chatContainer = document.getElementById('chat-container');

        const savedUsername = localStorage.getItem('mqtt_chat_username');
        if (savedUsername) {
            usernameInput.value = savedUsername;
        }

        brokerSelect.addEventListener('change', () => {
            if (brokerSelect.value === 'custom') {
                brokerUrlCustom.style.display = 'block';
                brokerUrlCustom.focus();
            } else {
                brokerUrlCustom.style.display = 'none';
            }
        });

        function appendMessage(sender, text, type = 'incoming') {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            const timeString = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            let senderHtml = sender ? `<div class="sender">${escapeHtml(sender)}</div>` : '';
            div.innerHTML = `${senderHtml}<div>${escapeHtml(text)}</div><div class="time">${timeString}</div>`;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return div; // Retornar el elemento por si queremos actualizar su texto luego
        }

        function appendFileLink(sender, fileName, url, type = 'incoming') {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            const timeString = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            let senderHtml = sender ? `<div class="sender">${escapeHtml(sender)}</div>` : '';
            div.innerHTML = `${senderHtml}<div>Archivo recibido: <strong>${escapeHtml(fileName)}</strong><br><a class="file-link" href="${url}" download="${fileName}">Descargar Archivo</a></div><div class="time">${timeString}</div>`;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function getCryptoKey(password) {
            const enc = new TextEncoder();
            const keyMaterial = await window.crypto.subtle.importKey(
                "raw",
                enc.encode(password),
                { name: "PBKDF2" },
                false,
                ["deriveKey"]
            );
            const salt = enc.encode("mqtt_chat_salt_fija");
            return window.crypto.subtle.deriveKey(
                { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
                keyMaterial,
                { name: "AES-GCM", length: 256 },
                false,
                ["encrypt", "decrypt"]
            );
        }

        async function encryptMessage(text, key) {
            const enc = new TextEncoder();
            const iv = window.crypto.getRandomValues(new Uint8Array(12));
            const encoded = enc.encode(text);
            const ciphertext = await window.crypto.subtle.encrypt(
                { name: "AES-GCM", iv: iv },
                key,
                encoded
            );
            const combined = new Uint8Array(iv.byteLength + ciphertext.byteLength);
            combined.set(iv, 0);
            combined.set(new Uint8Array(ciphertext), iv.byteLength);
            return btoa(String.fromCharCode(...combined));
        }

        async function decryptMessage(base64Data, key) {
            try {
                const combined = Uint8Array.from(atob(base64Data), c => c.charCodeAt(0));
                const iv = combined.slice(0, 12);
                const ciphertext = combined.slice(12);
                const decrypted = await window.crypto.subtle.decrypt(
                    { name: "AES-GCM", iv: iv },
                    key,
                    ciphertext
                );
                return new TextDecoder().decode(decrypted);
            } catch (e) {
                return null;
            }
        }

        async function calculateHash(arrayBuffer) {
            const hashBuffer = await crypto.subtle.digest('SHA-256', arrayBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // --- WebRTC Setup & Signaling ---
        function setupPeerConnection() {
            if (peerConnection) return;
            peerConnection = new RTCPeerConnection(rtcConfig);

            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    sendEncryptedSignal({
                        type: 'webrtc_candidate',
                        candidate: event.candidate
                    });
                }
            };

            peerConnection.ondatachannel = (event) => {
                dataChannel = event.channel;
                setupDataChannel();
            };
        }

        function setupDataChannel() {
            dataChannel.binaryType = 'arraybuffer';
            let receivedBuffers = [];
            let receivedSize = 0;
            let fileMeta = null;
            let progressMsgDiv = null;

            dataChannel.onopen = () => {
                appendMessage('Sistema', 'Túnel P2P establecido correctamente.', 'system');
            };

            dataChannel.onmessage = async (event) => {
                if (typeof event.data === 'string') {
                    const msg = JSON.parse(event.data);
                    if (msg.type === 'file-meta') {
                        fileMeta = msg;
                        receivedBuffers = [];
                        receivedSize = 0;
                        progressMsgDiv = appendMessage('Sistema', `Recibiendo ${fileMeta.name}: 0%`, 'system');
                    }
                } else {
                    receivedBuffers.push(event.data);
                    receivedSize += event.data.byteLength;

                    if (fileMeta) {
                        const percent = Math.floor((receivedSize / fileMeta.size) * 100);
                        if (progressMsgDiv) {
                            progressMsgDiv.querySelector('div:nth-child(2)').textContent = `Recibiendo ${fileMeta.name}: ${percent}% (${(receivedSize / (1024*1024)).toFixed(1)} / ${(fileMeta.size / (1024*1024)).toFixed(1)} MB)`;
                        }
                    }

                    if (receivedSize >= fileMeta.size) {
                        if (progressMsgDiv) {
                            progressMsgDiv.querySelector('div:nth-child(2)').textContent = `Verificando integridad SHA-256 de ${fileMeta.name}...`;
                        }
                        const completeBlob = new Blob(receivedBuffers);
                        const arrayBuffer = await completeBlob.arrayBuffer();
                        const calculatedHash = await calculateHash(arrayBuffer);

                        if (calculatedHash === fileMeta.hash) {
                            if (progressMsgDiv) progressMsgDiv.remove();
                            const url = URL.createObjectURL(completeBlob);
                            appendFileLink(fileMeta.sender, fileMeta.name, url, 'incoming');
                        } else {
                            if (progressMsgDiv) {
                                progressMsgDiv.querySelector('div:nth-child(2)').textContent = `¡Error de integridad! El hash SHA-256 no coincide en ${fileMeta.name}.`;
                            }
                        }
                    }
                }
            };
        }

        async function sendEncryptedSignal(signalObj) {
            const topic = topicInput.value.trim();
            const sender = usernameInput.value.trim() || 'Anónimo';
            const payloadObj = {
                sessionId: mySessionId,
                sender: sender,
                type: 'signal',
                signal: signalObj
            };
            const encrypted = await encryptMessage(JSON.stringify(payloadObj), cryptoKey);
            client.publish(topic, encrypted, { qos: 0 });
        }

        connectBtn.addEventListener('click', async () => {
            let url = brokerSelect.value === 'custom' ? brokerUrlCustom.value.trim() : brokerSelect.value;
            const topic = topicInput.value.trim();
            const username = usernameInput.value.trim() || 'Anónimo';
            const password = passwordInput.value;

            if (!url || !topic || !password) {
                alert('Introduce una URL válida, un topic y una contraseña compartida.');
                return;
            }

            localStorage.setItem('mqtt_chat_username', username);

            try {
                cryptoKey = await getCryptoKey(password);
            } catch (e) {
                alert('Error al generar la clave criptográfica.');
                return;
            }

            appendMessage('', `Conectando a ${url}...`, 'system');

            client = mqtt.connect(url, {
                clientId: 'mqtt_web_' + Math.random().toString(16).substr(2, 8),
                clean: true
            });

            client.on('connect', () => {
                appendMessage('', '¡Conectado exitosamente!', 'system');
                connectBtn.style.display = 'none';
                disconnectBtn.style.display = 'inline-block';
                brokerSelect.disabled = true;
                brokerUrlCustom.disabled = true;
                topicInput.disabled = true;
                usernameInput.disabled = true;
                passwordInput.disabled = true;
                messageInput.disabled = false;
                sendBtn.disabled = false;
                attachBtn.disabled = false;
                messageInput.focus();

                client.subscribe(topic, (err) => {
                    if (!err) {
                        appendMessage('', `Suscrito al topic: ${topic}`, 'system');
                    }
                });
            });

            client.on('message', async (incomingTopic, payload) => {
                const decryptedStr = await decryptMessage(payload.toString(), cryptoKey);
                if (decryptedStr) {
                    try {
                        const data = JSON.parse(decryptedStr);
                        if (data.sessionId === mySessionId) return;

                        if (data.type === 'chat') {
                            appendMessage(data.sender, data.text, 'incoming');
                        } else if (data.type === 'signal') {
                            setupPeerConnection();
                            const sig = data.signal;
                            if (sig.type === 'webrtc_offer') {
                                await peerConnection.setRemoteDescription(new RTCSessionDescription(sig.offer));
                                const answer = await peerConnection.createAnswer();
                                await peerConnection.setLocalDescription(answer);
                                sendEncryptedSignal({ type: 'webrtc_answer', answer: answer });
                            } else if (sig.type === 'webrtc_answer') {
                                await peerConnection.setRemoteDescription(new RTCSessionDescription(sig.answer));
                            } else if (sig.type === 'webrtc_candidate') {
                                try {
                                    await peerConnection.addIceCandidate(new RTCIceCandidate(sig.candidate));
                                } catch (e) {}
                            }
                        }
                    } catch (e) {
                        appendMessage('Desconocido', decryptedStr, 'incoming');
                    }
                } else {
                    appendMessage('Sistema', '[Mensaje ignorado: Contraseña incorrecta o ilegible]', 'system');
                }
            });

            client.on('error', (err) => {
                appendMessage('', `Error de conexión: ${err.message}`, 'system');
                client.end();
            });

            client.on('close', () => {
                resetUI();
                appendMessage('', 'Conexión cerrada.', 'system');
            });
        });

        disconnectBtn.addEventListener('click', () => {
            if (client) client.end();
            if (peerConnection) { peerConnection.close(); peerConnection = null; }
        });

        async function sendMessage() {
            const text = messageInput.value.trim();
            const topic = topicInput.value.trim();
            const sender = usernameInput.value.trim() || 'Anónimo';

            if (!text || !client || !client.connected || !cryptoKey) return;

            const payloadObj = { 
                sessionId: mySessionId,
                sender: sender, 
                type: 'chat',
                text: text 
            };
            
            const encryptedPayload = await encryptMessage(JSON.stringify(payloadObj), cryptoKey);

            client.publish(topic, encryptedPayload, { qos: 0 }, (err) => {
                if (!err) {
                    appendMessage(sender, text, 'outgoing');
                    messageInput.value = '';
                } else {
                    appendMessage('', 'Error al enviar mensaje', 'system');
                }
            });
        }

        // --- Manejo de Envío con Porcentaje y Backpressure ---
        attachBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', async () => {
            const files = fileInput.files;
            if (!files.length) return;

            setupPeerConnection();
            if (!dataChannel || dataChannel.readyState !== 'open') {
                dataChannel = peerConnection.createDataChannel('file-transfer', { ordered: true });
                setupDataChannel();
                
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                sendEncryptedSignal({ type: 'webrtc_offer', offer: offer });
                
                appendMessage('Sistema', 'Iniciando conexión P2P con el par...', 'system');
                await new Promise((resolve) => {
                    const checkInterval = setInterval(() => {
                        if (dataChannel.readyState === 'open') {
                            clearInterval(checkInterval);
                            resolve();
                        }
                    }, 100);
                });
            }

            for (let file of files) {
                const calcMsg = appendMessage('Sistema', `Calculando hash SHA-256 de ${file.name}...`, 'system');
                const fullArrayBuffer = await file.arrayBuffer();
                const hash = await calculateHash(fullArrayBuffer);
                calcMsg.remove();

                const sender = usernameInput.value.trim() || 'Anónimo';
                dataChannel.send(JSON.stringify({
                    type: 'file-meta',
                    name: file.name,
                    size: file.size,
                    hash: hash,
                    sender: sender
                }));

                const progressMsg = appendMessage('Sistema', `Enviando ${file.name}: 0%`, 'system');

                const CHUNK_SIZE = 256 * 1024; // 256 KB por bloque
                let offset = 0;

                while (offset < file.size) {
                    if (dataChannel.bufferedAmount > 1024 * 1024) {
                        await new Promise(resolve => {
                            dataChannel.bufferedAmountLowThreshold = 512 * 1024;
                            dataChannel.onbufferedamountlow = () => {
                                dataChannel.onbufferedamountlow = null;
                                resolve();
                            };
                            setTimeout(resolve, 50);
                        });
                    }

                    const slice = file.slice(offset, offset + CHUNK_SIZE);
                    const chunk = await slice.arrayBuffer();
                    dataChannel.send(chunk);
                    offset += chunk.byteLength;

                    const percent = Math.floor((offset / file.size) * 100);
                    progressMsg.querySelector('div:nth-child(2)').textContent = `Enviando ${file.name}: ${percent}% (${(offset / (1024*1024)).toFixed(1)} / ${(file.size / (1024*1024)).toFixed(1)} MB)`;
                }

                progressMsg.remove();
                appendMessage('Sistema', `¡Archivo enviado con éxito: ${file.name}!`, 'system');
            }
            fileInput.value = '';
        });

        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function resetUI() {
            connectBtn.style.display = 'inline-block';
            disconnectBtn.style.display = 'none';
            brokerSelect.disabled = false;
            brokerUrlCustom.disabled = false;
            topicInput.disabled = false;
            usernameInput.disabled = false;
            passwordInput.disabled = false;
            messageInput.disabled = true;
            sendBtn.disabled = true;
            attachBtn.disabled = true;
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
